name: kontrol
on:
  push:
  pull_request:
jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testler
        run: python3 -m unittest discover -s araclar -v
      - name: Kayıtları doğrula
        run: python3 araclar/uret.py --kontrol
      - name: Üretilen sayfalar güncel mi?
        run: |
          python3 araclar/uret.py
          git diff --exit-code -- kayitlar sitemap.xml
